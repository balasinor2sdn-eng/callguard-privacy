name: Build Baby Alert APK

on:
  push:
    paths:
      - 'baby-alert/**'
      - '.github/workflows/baby-alert-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baby-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BabyAlert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BabyAlert
          path: baby-alert/BabyAlert.apk

      - name: Publish as GitHub release (easy download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete baby-alert-latest --yes --cleanup-tag || true
          gh release create baby-alert-latest BabyAlert.apk \
            --target "${{ github.sha }}" \
            --title "Baby Alert (latest)" \
            --notes "Download BabyAlert.apk on your wife's phone and install it. See baby-alert/README.md for setup."
